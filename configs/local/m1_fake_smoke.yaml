hsdp_dim: 1
logging:
  project: "local-drifting-smoke"
  entity: null
  use_wandb: false
  log_every_k: 1

dataset:
  source: fake
  resolution: 16
  use_aug: false
  use_latent: false
  use_cache: false
  num_classes: 10
  batch_size: 8
  eval_batch_size: 8
  kwargs:
    fake_train_size: 32
    fake_val_size: 16
    num_workers: 0
    pin_memory: false

model:
  cond_dim: 64
  input_size: 16
  in_channels: 3
  patch_size: 4
  hidden_size: 64
  depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  out_channels: 3
  use_qknorm: false
  use_swiglu: false
  use_rope: false
  use_rmsnorm: false
  n_cls_tokens: 0
  noise_classes: 0
  noise_coords: 1
  use_bf16: false
  attn_fp32: true
  use_remat: false

optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 1
    lr_schedule: "const"
    total_steps: 1
  weight_decay: 0.0
  adam_b1: 0.9
  adam_b2: 0.95

train:
  train_batch_size: 2
  seed: 42
  total_steps: 1
  save_per_step: 1
  keep_every: 100
  keep_last: 1
  eval_per_step: 1
  enable_eval: false
  pos_per_sample: 2
  neg_per_sample: 2
  positive_bank_size: 4
  negative_bank_size: 8
  forward_dict:
    gen_per_label: 2
    cfg_min: 1.0
    cfg_max: 2.0
    neg_cfg_pw: 1.0
    no_cfg_frac: 0.0
  activation_kwargs: {}
  loss_kwargs:
    R_list: [0.2]
  cfg_list: [1.0]
  ema_decay: 0.999
  push_per_step: 8

feature:
  mae_path: ""
  use_convnext: false
  use_mae: false
