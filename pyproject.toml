[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drifting-models"
version = "0.2.0.dev0"
description = "Explicit JAX and PyTorch backends for Generative Modeling via Drifting"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
drifting-jax-train = "drifting_jax.cli:train_main"
drifting-jax-infer = "drifting_jax.cli:infer_main"
drifting-jax-cache = "drifting_jax.cli:cache_main"
drifting-torch-cache = "drifting_torch.data.cli:main"
drifting-torch-train = "drifting_torch.cli:train_main"
drifting-torch-train-mae = "drifting_torch.cli:mae_main"
drifting-torch-infer = "drifting_torch.cli:infer_main"

[project.optional-dependencies]
jax = [
  "jax==0.4.37",
  "jaxlib==0.4.36",
  "flax==0.10.4",
  "optax==0.2.5",
  "orbax-checkpoint==0.11.0",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "diffusers>=0.37,<1",
  "transformers>=5.3,<6",
  "huggingface-hub>=1.7,<2",
  "einops>=0.8,<1",
  "scipy>=1.15,<2",
  "wandb>=0.25,<1",
]
torch = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "diffusers>=0.37,<1",
  "transformers>=5.3,<6",
  "huggingface-hub>=1.7,<2",
  "safetensors>=0.5,<1",
  "einops>=0.8,<1",
  "scipy>=1.15,<2",
  "wandb>=0.25,<1",
]
parity = [
  "jax==0.4.37",
  "jaxlib==0.4.36",
  "flax==0.10.4",
  "optax==0.2.5",
  "orbax-checkpoint==0.11.0",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "diffusers>=0.37,<1",
  "transformers>=5.3,<6",
  "huggingface-hub>=1.7,<2",
  "safetensors>=0.5,<1",
  "einops>=0.8,<1",
  "scipy>=1.15,<2",
  "wandb>=0.25,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/drifting-models/configs/gen" = ["configs/gen/*.yaml"]
"share/drifting-models/configs/mae" = ["configs/mae/*.yaml"]
"share/drifting-models/configs/local" = ["configs/local/*.yaml"]
"share/drifting-models/configs/runtime/jax" = ["configs/runtime/jax/*.yaml"]
"share/drifting-models/configs/runtime/torch" = ["configs/runtime/torch/*.yaml"]
"share/drifting-models/notebooks/torch" = ["notebooks/torch/*.ipynb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
